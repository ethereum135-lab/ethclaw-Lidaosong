# A9 学研官 配置文件

model:
  default: deepseek-v4-flash
  provider: deepseek
  temperature: 0.4       # 学习可以有些创新
  fallback:
    model: claude-sonnet-4
    provider: anthropic

paths:
  profile_dir: profiles/a9-research/
  output_dir: profiles/a9-research/output/
  logs_dir: profiles/a9-research/logs/
