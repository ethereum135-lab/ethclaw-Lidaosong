name: CI/CD Full Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 手动触发

env:
  DEPLOY_USER: ubuntu
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PATH: /home/ubuntu/shared_context

jobs:
  # ---------- Job 1: Lint & Test ----------
  lint-test:
    name: "代码检查与语法验证"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Python syntax check (py_compile)
        run: |
          echo "=== Python 语法检查 ==="
          find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*" -not -path "./__pycache__/*" \
            -exec python -m py_compile {} \; 2>&1 | tee /tmp/syntax_errors.log
          if [ -s /tmp/syntax_errors.log ]; then
            echo "⚠️  发现语法错误（警告模式，不阻断部署）"
            echo "错误数量: $(grep -c 'SyntaxError' /tmp/syntax_errors.log || echo 0)"
          else
            echo "✅ 所有Python文件语法正确"
          fi

      - name: Flake8 style check (warning only)
        run: |
          echo "=== Flake8 代码风格检查（仅警告，不阻断） ==="
          pip install flake8 -q
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.git,venv,__pycache__ || true
          echo "⚠️  风格检查完成（仅参考，不阻断部署）"

      - name: Check for hardcoded secrets
        run: |
          echo "=== 硬编码密钥扫描 ==="
          # 简单扫描：检查API Key/Secret/Token等关键词
          FOUND=0
          grep -r "api_key\s*=\s*['\"][a-zA-Z0-9]\{16,\}" --include="*.py" --include="*.json" . 2>/dev/null && FOUND=1 || true
          grep -r "secret\s*=\s*['\"][a-zA-Z0-9]\{16,\}" --include="*.py" --include="*.json" . 2>/dev/null && FOUND=1 || true
          grep -r "token\s*=\s*['\"][a-zA-Z0-9]\{20,\}" --include="*.py" --include="*.json" . 2>/dev/null && FOUND=1 || true
          if [ "$FOUND" -eq 1 ]; then
            echo "⚠️  警告：发现疑似硬编码密钥，请检查.env是否被正确排除"
          else
            echo "✅ 未发现硬编码密钥"
          fi

      - name: Upload syntax report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: /tmp/syntax_errors.log
          if-no-files-found: ignore

  # ---------- Job 2: Blueprint Consistency Check ----------
  blueprint-check:
    name: "蓝图一致性检查"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run blueprint consistency verification
        run: |
          chmod +x scripts/verify_blueprint.sh
          bash scripts/verify_blueprint.sh

      - name: Upload blueprint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-report
          path: /tmp/blueprint_check_report.txt
          if-no-files-found: ignore

  # ---------- Job 3: Deploy to VPS ----------
  deploy:
    name: "部署到AWS VPS"
    runs-on: ubuntu-latest
    needs: [lint-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy files
        run: |
          echo "=== 开始部署到 VPS ==="
          chmod +x scripts/deploy.sh
          bash scripts/deploy.sh
          echo "✅ 部署完成"

      - name: Sync crontab
        run: |
          echo "=== 同步 Cron ==="
          chmod +x scripts/sync_cron.sh
          bash scripts/sync_cron.sh
          echo "✅ Cron 同步完成"

      - name: Post-deploy verification
        run: |
          echo "=== 部署后验证 ==="
          ssh $DEPLOY_USER@$DEPLOY_HOST "
            echo '--- 文件数量 ---'
            ls $DEPLOY_PATH/*.py | wc -l
            echo '--- Cron 行数 ---'
            crontab -l | wc -l
            echo '--- Vibe-Trading 状态 ---'
            systemctl is-active vibe-trading || echo '未运行'
            echo '--- 最近日志 ---'
            tail -3 $DEPLOY_PATH/logs/daily_report.log 2>/dev/null || echo '无日志'
          "
          echo "✅ 部署验证完成"

      - name: Send deployment notification
        run: |
          echo "=== 发送部署通知 ==="
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            MESSAGE="✅ 部署完成 $(date '+%Y-%m-%d %H:%M')
            提交: ${{ github.sha }}
            作者: ${{ github.actor }}
            消息: ${{ github.event.head_commit.message }}"
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="$MESSAGE" || echo "Telegram通知失败（可选）"
          else
            echo "⚠️  未配置Telegram通知（可选）"
          fi
